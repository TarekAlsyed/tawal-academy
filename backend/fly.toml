# fly.toml app configuration file generated for tawal-academy-backend on 2026-02-09T22:59:44+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tawal-academy-backend-v2'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = '1m'
  interval = '30s'
  method = 'get'
  path = '/health'
  protocol = 'http'
  timeout = '20s'
  tls_skip_verify = false

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[mounts]]
  source = "uploads_data"
  destination = "/app/uploads"
